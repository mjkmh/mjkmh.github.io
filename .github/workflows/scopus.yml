name: Scopus yayın güncellemesi

on:
  schedule:
    - cron: "17 4 1 * *"   # her ayın 1'i, 07:17 (İstanbul)
  workflow_dispatch:         # GitHub'da "Run workflow" ile elle de çalıştırılabilir
    inputs:
      deneme:
        description: "Deneme (dosyaları değiştirme, yalnızca listele)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install pybliometrics pandas pyyaml openpyxl

      - name: Scopus'tan çek
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        run: python scripts/scopus_guncelle.py --crossref ${{ inputs.deneme && '--deneme' || '' }}

      - name: Değiştiyse kaydet
        run: |
          git add -N sitefinity
          if git diff --quiet _data/yayinlar.yml _data/yayin_istatistik.yml sitefinity; then
            echo "Yeni yayın yok."
          else
            git config user.name "mjkmh-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/yayinlar.yml _data/yayin_istatistik.yml sitefinity
            git commit -m "Yayınlar Scopus'tan güncellendi ($(date +%d.%m.%Y))"
            git push
          fi

