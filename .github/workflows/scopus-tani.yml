name: Scopus erişim tanısı (geçici)
on: workflow_dispatch
jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - name: Uç noktaları dene
        env:
          K: ${{ secrets.SCOPUS_API_KEY }}
        run: |
          for u in \
            "search/scopus?query=AU-ID(57189441189)&count=25&view=STANDARD" \
            "search/scopus?query=AU-ID(57189441189)&count=25" \
            "search/scopus?query=AU-ID(57189441189)&count=5&field=eid,doi,dc:title" \
            "author/author_id/57189441189?view=LIGHT" \
            "serial/title/issn/1435-9529?view=CITESCORE" \
            "abstract/eid/2-s2.0-85216549603?view=META"; do
            echo "== $u"
            curl -s -o out.json -w "HTTP %{http_code}\n" -H "X-ELS-APIKey: $K" -H "Accept: application/json" "https://api.elsevier.com/content/$u"
            head -c 300 out.json; echo
          done
