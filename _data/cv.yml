  ozgecmis: İstanbul Teknik Üniversitesi Maden Fakültesi Jeoloji Mühendisliği Bölümü’nde öğretim üyesi olarak görev yapmaktadır. Araştırmaları mühendislik jeolojisi, kaya mekaniği ve yer bilimlerinde mekânsal analiz konularında yoğunlaşmaktadır. Arazi
    gözlemleri, laboratuvar deneyleri, sayısal analizler ve mekânsal veri işleme yöntemlerini birlikte kullanarak kaya ve zemin ortamlarının mühendislik davranışını, jeolojik tehlikeleri ve bu tehlikelerin altyapı sistemleri, yerleşim alanları ve kültürel
    miras yapıları üzerindeki etkilerini çalışmaktadır.
  ozgecmis_en: He is a faculty member at the Department of Geological Engineering, Faculty of Mines, Istanbul Technical University. His research focuses on engineering geology, rock mechanics and spatial analysis in the earth sciences. Combining field observations, laboratory experiments, numerical analyses and spatial data processing, he studies the engineering behaviour of rock and soil, geological hazards, and the impact of these hazards on infrastructure systems, settlements and cultural heritage structures.
  uzmanlik_en: [Engineering geology, Rock mechanics, Spatial analysis in the earth sciences]
